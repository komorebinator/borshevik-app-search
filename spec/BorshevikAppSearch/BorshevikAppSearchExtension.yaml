description: GNOME Shell extension entry point. Makes app search find apps whatever keyboard layout the query was typed in: with English and Russian layouts loaded, "кал" typed in the Russian layout also searches "rfk" — what the same keys produce in English — and "rfk" typed in English also finds "калькулятор". Every pair of loaded xkb layouts is used in both directions, whichever layout is active. It builds a character map per layout pair from the system's XKB symbols files and wraps GNOME Shell's app search provider to add the transcoded searches' results after the original ones.
extends: @Extension
target: @GnomeShell
platform: GJS (GNOME Shell 50+) — Gio, Gdk, GioUnix, Shell, AppDisplay
src: borshevik-app-search@komorebinator/extension.js
fields:
  - id: KEY_INDEX
    type: "{ [xkbKeyCode: string]: number }"
    description: The common coordinate space two layouts are compared in: the keys of the three letter rows — AD01–AD12, AC01–AC11, AB01–AB09 — numbered 0–31, so a character is matched with the one on the same physical key. The digit row is not part of it, so digits and the symbols on that row are never transcoded.
  - id: this._layoutCache
    type: "Map<string, (string|null)[]>"
    default: new Map()
    description: The character table of each loaded xkb layout, by layout id.
  - id: this._maps
    type: "Map<string,string>[]"
    default: "[]"
    description: The transcoding maps the search uses, two per pair of loaded layouts, one for each direction.
  - id: this._original
    type: "function | null"
    default: "null"
    description: The search provider's own getInitialResultSet, kept to call from the wrapper and restored by disable().
  - id: this._syncGeneration
    type: number
    default: 0
    description: Counts _syncLayouts runs, and is also bumped by disable(), so a run that finds it was superseded while loading layouts leaves _maps alone instead of overwriting a newer result.
functions:
  - id: parseLayoutChars
    description: The base (unshifted) character on each key of KEY_INDEX, read from an XKB symbols file: the first definition of a key wins, control characters and space are skipped, and a file yielding no character at all counts as no layout.
  - id: loadLayoutChars
    description: Reads a layout's character table from its file under /usr/share/X11/xkb/symbols. A variant is read from its base layout's file — `ru(phonetic)` from `ru` — so a variant is transcoded as its base layout, not as the variant itself. Any failure yields no layout rather than an error.
  - id: buildMap
    description: The map from one layout's characters to another's, key by key, leaving out keys where either has nothing or both have the same character.
  - id: transcode
    description: Replaces a string character by character through a map; anything not in the map passes through unchanged.
  - id: enable
    description: Follows the input sources (_syncLayouts now and on every change) and wraps the app search provider's getInitialResultSet. The wrapper returns the original results first and unchanged; it then transcodes the query through every map and, for each distinct query that differs from the typed one, adds the apps DesktopAppInfo's search finds that should be shown — most used first, without duplicates. DesktopAppInfo.search() may return null, and a group in its result may not be an array; both are skipped, since iterating them would throw inside every search.
  - id: _syncLayouts
    description: Keeps one character table per xkb input source — ibus sources are ignored — loading new ones and dropping removed ones, then rebuilds the maps for every pair in both directions, unless a newer run started meanwhile (this._syncGeneration).
  - id: _loadLayout
    description: Loads one layout into the cache. A layout that fails to load is not cached, so it is tried again at the next change of input sources.
  - id: disable
    description: Restores the original search, stops following the input sources, invalidates any _syncLayouts still running, and drops the caches.
components:
  - id: metadata
    type: @ConfigFile
    src: borshevik-app-search@komorebinator/metadata.json
    description: Extension manifest: GNOME Shell 50 only, and no settings schema — which is why the extension never calls getSettings() (see this project's guidelines).
tests:
  - id: tried-by-the-author
    description: Manual. Whether search finds apps from a query typed in the other layout can only be seen in a running shell, with the author's own layouts and apps.
    command: "@BorshevikAppSearchExtension#recipes#run"
    expect: "the extension is ACTIVE in `gnome-extensions info`; no errors from it in `journalctl --user -b _COMM=gnome-shell`; with two layouts loaded, a query typed in the wrong one finds the app, and results for a correctly typed query are unchanged"
recipes:
  - id: run
    description: Runs the extension from the working tree in the current session. On Wayland GNOME Shell cannot be restarted in place, so a relogin is part of it.
    instructions:
      - "Link the working-tree extension into the user's extensions directory: `ln -sfn <repository>/borshevik-app-search@komorebinator ~/.local/share/gnome-shell/extensions/borshevik-app-search@komorebinator`. A per-user extension overrides a system-wide one with the same uuid, so this also works on an image that already ships the extension under /usr/share/gnome-shell/extensions. If that path already holds a real directory, or a link pointing anywhere else, stop and ask — it is an installation someone made on purpose"
      - "Enable it with `gnome-extensions enable borshevik-app-search@komorebinator`, then ask the user to log out and back in; a new module is only loaded by a fresh shell. Never log them out yourself — it ends every program in the session"
      - "After the relogin, report `gnome-extensions info borshevik-app-search@komorebinator` and any lines mentioning the extension in `journalctl --user -b _COMM=gnome-shell`, then let the user try a search typed in the wrong layout"
